name: Update Filter Lists

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Config to run (leave blank to run all daily configs)'
        required: false
        default: ''
        type: string

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        config_file: >-
          ${{ 
            github.event_name == 'workflow_dispatch' && github.event.inputs.config_file != '' 
            && format('["{0}"]', github.event.inputs.config_file) 
            || '["sources-150kLimit.json", "sources-macos.json"]' | fromJSON(...)
          }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Write merge script
        run: |
          cat > merge_filters.py << 'EOF'
          import json, requests, os, sys
          from datetime import datetime, timezone

          config_filename = os.environ.get('CONFIG_FILE', 'sources.json')
          print(f"📄 Processing config: {config_filename}")

          if not os.path.exists(config_filename):
              print(f"❌ Config file not found: {config_filename}")
              sys.exit(1)

          with open(config_filename) as f:
              config = json.load(f)

          sources = config['sources']
          max_rules = config.get('max_rules', 150000)
          output_file = config.get('output_file', 'vivaldi-combined.txt')

          # Dynamic title logic (simplified)
          config_basename = os.path.basename(config_filename)
          if config_basename.startswith('sources-') and config_basename.endswith('.json'):
              platform_tag = config_basename[len('sources-'):-len('.json')]
              platform_display = platform_tag.title()
          else:
              platform_display = 'Combined'

          headers = {'User-Agent': 'Vivaldi-iOS-FilterMerger/1.0'}
          seen = set()
          all_rules = []
          source_counts = {}

          for url in sources:
              try:
                  resp = requests.get(url, headers=headers, timeout=30)
                  resp.raise_for_status()
                  rules = []
                  for line in resp.text.splitlines():
                      line = line.strip()
                      # Ignore empty lines, comments (!), and headers ([Adblock Plus 2.0])
                      if not line or line.startswith('!') or line.startswith('['):
                          continue

                      # Deduplicate (keep this - it protects the 150k limit)
                      if line not in seen:
                          seen.add(line)
                          rules.append(line)

                  all_rules.extend(rules)
                  source_counts[url] = len(rules)
                  print(f"✅ {url.split('/')[-1]}: Kept {len(rules)} unique rules")
              except Exception as e:
                  print(f"⚠️ Failed to fetch {url}: {e}")
                  source_counts[url] = 0

          # Add Bing Rewards exceptions at the top
          bing_exceptions = [
              "@@||bat.bing.com^",
              "@@||rewards.bing.com^",
              "@@||c.bing.com^",
              "@@||login.microsoftonline.com^$domain=bing.com|rewards.bing.com",
              "@@||*.bing.com^$domain=bing.com|rewards.bing.com",
              "@@||bing.com/WidgetServ/RequestWidgetService.aspx?$xmlhttprequest,domain=rewards.bing.com"
          ]
          for rule in reversed(bing_exceptions):
              if rule not in seen:
                  all_rules.insert(0, rule)
                  seen.add(rule)
          print(f"✅ Added {len(bing_exceptions)} Bing Rewards exceptions")

          # Truncate if necessary
          truncated = len(all_rules) > max_rules
          if truncated:
              print(f"⚠️ WARNING: Truncated from {len(all_rules)} to {max_rules} rules")
              print(f"⚠️ TIP: Reorder your sources.json to put your most important lists at the TOP!")
              all_rules = all_rules[:max_rules]

          today = datetime.now(timezone.utc).strftime('%Y%m%d')
          truncation_note = " (TRUNCATED)" if truncated else ""

          header_lines = [
              "[Adblock Plus 2.0]",
              f"! Title: Vivaldi {platform_display} Combined (Auto-Updated){truncation_note}",
              f"! Version: {today}",
              "! Expires: 1 days",
              f"! Global Rules: {len(all_rules)}{truncation_note}",
              "! Source Breakdown:"
          ]
          for url, count in source_counts.items():
              header_lines.append(f"! • {url}: {count} unique rules")
          header_lines.append("")

          with open(output_file, 'w') as f:
              f.write('\n'.join(header_lines))
              if all_rules:
                  f.write('\n'.join(all_rules) + '\n')

          print(f"✅ Generated {output_file} with {len(all_rules)} final rules")
          EOF

      - name: Run merge script
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
        run: python3 merge_filters.py

      - name: Commit and push changes
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin
          git pull --rebase origin ${{ github.ref_name }} || true

          OUTPUT_FILE=$(python3 -c "import json, os; cfg=json.load(open(os.environ.get('CONFIG_FILE'))); print(cfg['output_file'])")
          echo "📦 Output file: $OUTPUT_FILE"

          if [ -f "$OUTPUT_FILE" ]; then
            git add "$OUTPUT_FILE"
            if ! git diff --cached --quiet; then
              git pull --rebase origin ${{ github.ref_name }} || true
              git commit -m "chore: auto-update filter lists ($(date +%Y%m%d), config: $CONFIG_FILE)"
              for i in 1 2 3; do
                if git push origin ${{ github.ref_name }}; then
                  echo "✅ Changes pushed for $CONFIG_FILE"
                  break
                elif [ $i -eq 3 ]; then
                  echo "❌ Push failed after 3 attempts for $CONFIG_FILE"
                  exit 1
                else
                  echo "⚠️ Push attempt $i failed, retrying in 5s..."
                  git fetch origin
                  git pull --rebase origin ${{ github.ref_name }} || true
                  sleep 5
                fi
              done
            else
              echo "ℹ️ No changes for $CONFIG_FILE"
            fi
          else
            echo "❌ Output file not found: $OUTPUT_FILE"
            ls -la
            exit 1
          fi
